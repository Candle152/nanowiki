[package]
name = "nanowiki"
version = "0.1.0"
edition = "2024"
description = "A lightweight LLM-powered code knowledge base generator"
license = "MIT"
repository = "https://github.com/Candle152/nanowiki"
keywords = ["documentation", "llm", "codebase", "wiki"]
categories = ["development-tools"]

[lints.rust]
linker_messages = "allow"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
dialoguer = "0.11"
futures = "0.3"
git2 = "0.21.0"
globset = "0.4.20"
ignore = "0.4.33"
rig-core = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
